name: Apps (Windows + Linux + Android)

# Al publicar una Release (o subir una etiqueta vX.Y.Z) se compilan el instalador de Windows,
# el AppImage y el .deb de Linux y el APK de Android con esa versión y se adjuntan a la Release.
# Las apps consultan la última Release y se actualizan desde dentro (Windows instalado, AppImage de Linux y Android).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (p. ej. 0.2.0) — solo para pruebas manuales'
        required: false
        default: '0.0.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar y fijar versión
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - working-directory: app
        run: npm run win:build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: canvaspp-windows
          path: |
            app/electron/release/*.exe
            app/electron/release/latest.yml
            app/electron/release/*.blockmap
      # latest.yml y .blockmap: los usa el gestor de actualizaciones de la app para descargar e instalar la versión nueva
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/electron/release/*.exe
            app/electron/release/latest.yml
            app/electron/release/*.blockmap

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar y fijar versión
        working-directory: app
        run: |
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - working-directory: app
        run: npm run linux:build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: canvaspp-linux
          path: |
            app/electron/release/*.AppImage
            app/electron/release/*.deb
            app/electron/release/latest-linux.yml
      # latest-linux.yml: lo usa el AppImage para actualizarse desde la app
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/electron/release/*.AppImage
            app/electron/release/*.deb
            app/electron/release/latest-linux.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # el paquete "tools" ya no existe con las cmdline-tools nuevas: solo se instala platform-tools
      # (Gradle descarga la plataforma y las build-tools que falten; las licencias ya quedan aceptadas)
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Generar proyecto Android (Capacitor)
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm run android:sync
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml
      - name: Compilar y firmar APK
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            # firma fija: permite instalar cada versión nueva encima de la anterior
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            ./gradlew assembleRelease
            BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
            $BT/apksigner sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out ../../Canvas++.apk app/build/outputs/apk/release/app-release-unsigned.apk
            rm release.jks
          else
            echo "::warning::Sin secretos ANDROID_KEYSTORE_*: APK debug. Cada versión tendrá otra firma y habrá que desinstalar antes de actualizar."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../Canvas++.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: canvaspp-android
          path: Canvas++.apk
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Canvas++.apk
