services:
  canvaspp:
    # Opción A (recomendada): imagen publicada por GitHub Actions. Cambia TU_USUARIO.
    # image: ghcr.io/TU_USUARIO/canvaspp:latest
    # Opción B: compilar en el propio NAS desde el código fuente.
    build: .
    container_name: canvaspp
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Cambia esto por una contraseña larga. La misma se pone en Ajustes de la app.
      CANVAS_TOKEN: "cambia-este-token"
      # CANVAS_SIGNUP: "1"   # permite que cualquiera se cree una cuenta (si no, las crea el administrador)
    volumes:
      # Carpeta del NAS donde se guardan los proyectos (un JSON por proyecto).
      # Synology: p.ej. /volume1/docker/canvaspp:/data
      - ./data:/data
